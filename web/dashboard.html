<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Skedulr Dashboard</title>
	<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
	<style>
		/*
		 * Gruvbox dark-hard palette — same colors as Gruvbox's terminal/IDE
		 * themes so the dashboard sits comfortably alongside a developer's
		 * usual environment. Every UI element pulls from these variables;
		 * no glassmorphism, no translucency, no gradients on backgrounds.
		 */
		:root {
			--bg0-h:    #1d2021; /* deepest background — page */
			--bg0:      #282828; /* default background — cards */
			--bg1:      #3c3836; /* lifted background — hovered rows, badges */
			--bg2:      #504945; /* highest lifted — table headers, borders */
			--bg3:      #665c54;
			--fg0:      #fbf1c7; /* brightest foreground — primary text */
			--fg1:      #ebdbb2; /* default foreground */
			--fg2:      #d5c4a1;
			--fg3:      #bdae93; /* muted foreground — labels */
			--fg4:      #a89984; /* most muted */
			--gray:     #928374;

			--red:      #fb4934;
			--green:    #b8bb26;
			--yellow:   #fabd2f;
			--blue:     #83a598;
			--purple:   #d3869b;
			--aqua:     #8ec07c;
			--orange:   #fe8019;

			--red-dim:    #cc241d;
			--green-dim:  #98971a;
			--yellow-dim: #d79921;
			--blue-dim:   #458588;
			--purple-dim: #b16286;
			--aqua-dim:   #689d6a;
			--orange-dim: #d65d0e;

			--border:   #3c3836;
			--border-strong: #504945;
		}

		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		body {
			font-family: 'Inter', system-ui, sans-serif;
			background-color: var(--bg0-h);
			color: var(--fg1);
			display: flex;
			min-height: 100vh;
			overflow-x: hidden;
			font-size: 14px;
		}

		code, .mono { font-family: 'JetBrains Mono', monospace; }

		/* ── Sidebar ────────────────────────────────────────────────── */
		.sidebar {
			width: 240px;
			background-color: var(--bg0);
			padding: 1.5rem 1rem;
			display: flex;
			flex-direction: column;
			gap: 1.5rem;
			border-right: 1px solid var(--border);
			flex-shrink: 0;
		}

		.logo {
			font-family: 'JetBrains Mono', monospace;
			font-size: 1.25rem;
			font-weight: 700;
			color: var(--orange);
			padding: 0 0.5rem;
			letter-spacing: 0.05em;
		}
		.logo::before { content: ">_ "; color: var(--green); }

		.nav-links {
			list-style: none;
			display: flex;
			flex-direction: column;
			gap: 0.25rem;
		}

		.nav-item {
			padding: 0.6rem 0.75rem;
			border-radius: 4px;
			cursor: pointer;
			color: var(--fg3);
			font-weight: 500;
			border-left: 2px solid transparent;
		}
		.nav-item:hover {
			background-color: var(--bg1);
			color: var(--fg0);
		}
		.nav-item.active {
			background-color: var(--bg1);
			color: var(--orange);
			border-left-color: var(--orange);
		}

		/* ── Main content ──────────────────────────────────────────── */
		.main-content {
			flex: 1;
			padding: 1.5rem 2rem;
			max-width: 1400px;
			margin: 0 auto;
			width: 100%;
		}

		header {
			display: flex;
			justify-content: space-between;
			align-items: center;
			margin-bottom: 1.5rem;
			padding-bottom: 1rem;
			border-bottom: 1px solid var(--border);
		}
		h1 {
			font-size: 1.5rem;
			font-weight: 600;
			color: var(--fg0);
		}
		h2 {
			font-size: 1.125rem;
			font-weight: 600;
			color: var(--fg0);
		}

		.header-controls {
			display: flex;
			align-items: center;
			gap: 1rem;
		}
		.pause-pill {
			display: none;
			align-items: center;
			gap: 0.4rem;
			padding: 0.3rem 0.6rem;
			background: var(--bg1);
			border: 1px solid var(--yellow);
			border-radius: 3px;
			font-size: 0.75rem;
			font-weight: 700;
			color: var(--yellow);
			letter-spacing: 0.05em;
		}
		.pause-pill.visible { display: inline-flex; }
		.pause-pill::before {
			content: "";
			width: 6px; height: 6px;
			background: var(--yellow);
			border-radius: 50%;
		}

		.btn {
			background: var(--bg1);
			border: 1px solid var(--border-strong);
			color: var(--fg1);
			padding: 0.5rem 0.9rem;
			border-radius: 4px;
			cursor: pointer;
			font-weight: 500;
			font-size: 0.8125rem;
			font-family: inherit;
		}
		.btn:hover { background: var(--bg2); color: var(--fg0); }
		.btn-primary {
			background: var(--blue-dim);
			border-color: var(--blue-dim);
			color: var(--bg0-h);
		}
		.btn-primary:hover { background: var(--blue); border-color: var(--blue); }
		.btn-warn {
			background: var(--yellow-dim);
			border-color: var(--yellow-dim);
			color: var(--bg0-h);
		}
		.btn-warn:hover { background: var(--yellow); border-color: var(--yellow); }

		.live-dot {
			width: 7px; height: 7px;
			background: var(--green);
			border-radius: 50%;
			display: inline-block;
			margin-right: 0.4rem;
			box-shadow: 0 0 6px var(--green);
			animation: pulse 2s infinite ease-in-out;
		}
		@keyframes pulse {
			0%, 100% { opacity: 0.4; }
			50%      { opacity: 1; }
		}

		/* ── Metrics grid ──────────────────────────────────────────── */
		.metrics-grid {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
			gap: 0.75rem;
			margin-bottom: 1.5rem;
		}
		.metric-card {
			background: var(--bg0);
			padding: 1rem 1.25rem;
			border-radius: 4px;
			border: 1px solid var(--border);
			border-left: 3px solid var(--gray);
			display: flex;
			flex-direction: column;
			gap: 0.4rem;
		}
		.metric-card.queue    { border-left-color: var(--blue); }
		.metric-card.success  { border-left-color: var(--green); }
		.metric-card.failure  { border-left-color: var(--red); }
		.metric-card.dead     { border-left-color: var(--purple); }
		.metric-card.retrying { border-left-color: var(--yellow); }
		.metric-card.workers  { border-left-color: var(--aqua); }

		.metric-label {
			color: var(--fg4);
			font-size: 0.7rem;
			text-transform: uppercase;
			letter-spacing: 0.08em;
			font-weight: 600;
		}
		.metric-value {
			font-family: 'JetBrains Mono', monospace;
			font-size: 1.75rem;
			font-weight: 700;
			color: var(--fg0);
			line-height: 1;
		}
		#metric-queue    { color: var(--blue); }
		#metric-success  { color: var(--green); }
		#metric-failure  { color: var(--red); }
		#metric-dead     { color: var(--purple); }
		#metric-retrying { color: var(--yellow); }
		#metric-workers  { color: var(--aqua); }

		/* ── Content cards ─────────────────────────────────────────── */
		.content-card {
			background: var(--bg0);
			border-radius: 4px;
			border: 1px solid var(--border);
			padding: 1.25rem;
			margin-bottom: 1.25rem;
		}
		.card-header {
			margin-bottom: 1rem;
			display: flex;
			justify-content: space-between;
			align-items: center;
			gap: 1rem;
			flex-wrap: wrap;
		}

		/* ── Pools ─────────────────────────────────────────────────── */
		.pool-grid {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
			gap: 0.75rem;
		}
		.pool-card {
			background: var(--bg0-h);
			padding: 1rem;
			border-radius: 4px;
			border: 1px solid var(--border);
		}
		.pool-name {
			font-family: 'JetBrains Mono', monospace;
			font-size: 0.75rem;
			color: var(--aqua);
			text-transform: uppercase;
			letter-spacing: 0.08em;
			margin-bottom: 0.5rem;
		}
		.pool-worker-count {
			font-family: 'JetBrains Mono', monospace;
			font-size: 1.5rem;
			font-weight: 700;
			color: var(--fg0);
			line-height: 1;
		}
		.pool-worker-label { font-size: 0.75rem; color: var(--fg4); margin-left: 0.3rem; }
		.pool-controls {
			display: flex;
			align-items: center;
			gap: 0.5rem;
			margin-top: 0.75rem;
		}
		.pool-controls .btn {
			width: 28px; height: 28px;
			padding: 0;
			display: flex;
			align-items: center;
			justify-content: center;
			font-family: 'JetBrains Mono', monospace;
			font-weight: 700;
		}
		.pool-counter {
			font-family: 'JetBrains Mono', monospace;
			font-size: 0.875rem;
			font-weight: 600;
			min-width: 28px;
			text-align: center;
			color: var(--fg0);
		}
		.pool-queue {
			margin-top: 0.5rem;
			font-size: 0.75rem;
			color: var(--fg3);
			font-family: 'JetBrains Mono', monospace;
		}
		.pool-queue strong { color: var(--blue); }

		/* ── Filters ───────────────────────────────────────────────── */
		.filter-row {
			width: 100%;
			display: flex;
			gap: 0.5rem;
			align-items: center;
			flex-wrap: wrap;
		}
		.search-input {
			background: var(--bg0-h);
			border: 1px solid var(--border-strong);
			color: var(--fg0);
			padding: 0.45rem 0.7rem;
			border-radius: 3px;
			font-size: 0.8125rem;
			font-family: inherit;
			outline: none;
		}
		.search-input::placeholder { color: var(--fg4); }
		.search-input:focus { border-color: var(--orange); }

		.filter-group {
			display: flex;
			gap: 0.4rem;
			flex-wrap: wrap;
			margin-top: 0.75rem;
		}
		.filter-chip {
			padding: 0.35rem 0.7rem;
			border-radius: 3px;
			background: var(--bg0-h);
			border: 1px solid var(--border-strong);
			color: var(--fg3);
			font-size: 0.75rem;
			font-weight: 600;
			cursor: pointer;
			user-select: none;
			font-family: 'JetBrains Mono', monospace;
			letter-spacing: 0.03em;
		}
		.filter-chip:hover {
			background: var(--bg1);
			color: var(--fg0);
		}
		.filter-chip.active {
			background: var(--bg2);
			color: var(--fg0);
			border-color: var(--fg4);
		}
		.filter-chip.active[data-status=""]         { border-color: var(--orange); color: var(--orange); }
		.filter-chip.active[data-status="Running"]  { border-color: var(--blue);   color: var(--blue); }
		.filter-chip.active[data-status="Queued"]   { border-color: var(--aqua);   color: var(--aqua); }
		.filter-chip.active[data-status="Retrying"] { border-color: var(--yellow); color: var(--yellow); }
		.filter-chip.active[data-status="Succeeded"]{ border-color: var(--green);  color: var(--green); }
		.filter-chip.active[data-status="Failed"]   { border-color: var(--red);    color: var(--red); }
		.filter-chip.active[data-status="Dead"]     { border-color: var(--purple); color: var(--purple); }
		.filter-chip.active[data-status="Cancelled"]{ border-color: var(--gray);   color: var(--fg3); }

		/* ── Table ─────────────────────────────────────────────────── */
		table {
			width: 100%;
			border-collapse: collapse;
		}
		th {
			text-align: left;
			color: var(--fg4);
			font-size: 0.7rem;
			text-transform: uppercase;
			letter-spacing: 0.08em;
			font-weight: 600;
			padding: 0.6rem 0.75rem;
			border-bottom: 1px solid var(--border-strong);
			background: var(--bg0-h);
		}
		td {
			padding: 0.7rem 0.75rem;
			font-size: 0.8125rem;
			border-bottom: 1px solid var(--border);
			vertical-align: middle;
		}
		tbody tr:hover { background: var(--bg1); }

		.task-id {
			font-family: 'JetBrains Mono', monospace;
			font-size: 0.75rem;
			color: var(--fg2);
		}
		.task-meta {
			font-size: 0.7rem;
			color: var(--fg4);
			margin-top: 0.15rem;
		}
		.task-type {
			color: var(--fg0);
			font-weight: 500;
		}
		.task-priority {
			font-family: 'JetBrains Mono', monospace;
			color: var(--fg2);
		}

		/* ── Status badges (gruvbox per state) ──────────────────────── */
		.status-badge {
			display: inline-block;
			padding: 0.2rem 0.55rem;
			border-radius: 3px;
			font-size: 0.7rem;
			font-weight: 700;
			text-transform: uppercase;
			letter-spacing: 0.05em;
			font-family: 'JetBrains Mono', monospace;
			border: 1px solid;
		}
		.status-queued    { background: var(--bg1); color: var(--aqua);   border-color: var(--aqua-dim); }
		.status-running   { background: var(--bg1); color: var(--blue);   border-color: var(--blue-dim); }
		.status-retrying  { background: var(--bg1); color: var(--yellow); border-color: var(--yellow-dim); }
		.status-succeeded { background: var(--bg1); color: var(--green);  border-color: var(--green-dim); }
		.status-failed    { background: var(--bg1); color: var(--red);    border-color: var(--red-dim); }
		.status-dead      { background: var(--bg1); color: var(--purple); border-color: var(--purple-dim); }
		.status-cancelled { background: var(--bg1); color: var(--gray);   border-color: var(--bg3); }
		.status-unknown   { background: var(--bg1); color: var(--fg4);    border-color: var(--bg3); }

		/* ── Progress chip ─────────────────────────────────────────── */
		.progress-chip {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			padding: 0.2rem 0.55rem;
			border-radius: 3px;
			font-family: 'JetBrains Mono', monospace;
			font-weight: 700;
			font-size: 0.75rem;
			min-width: 52px;
			border: 1px solid;
		}
		.progress-chip.queued, .progress-chip.running    { background: var(--bg1); color: var(--blue);   border-color: var(--blue-dim); }
		.progress-chip.retrying                           { background: var(--bg1); color: var(--yellow); border-color: var(--yellow-dim); }
		.progress-chip.succeeded                          { background: var(--bg1); color: var(--green);  border-color: var(--green-dim); }
		.progress-chip.failed                             { background: var(--bg1); color: var(--red);    border-color: var(--red-dim); }
		.progress-chip.dead                               { background: var(--bg1); color: var(--purple); border-color: var(--purple-dim); }
		.progress-chip.cancelled                          { background: var(--bg1); color: var(--gray);   border-color: var(--bg3); }

		/* ── Action buttons ────────────────────────────────────────── */
		.action-btn {
			background: transparent;
			border: 1px solid;
			padding: 0.3rem 0.7rem;
			border-radius: 3px;
			cursor: pointer;
			font-size: 0.7rem;
			font-family: 'JetBrains Mono', monospace;
			font-weight: 700;
			letter-spacing: 0.05em;
			text-transform: uppercase;
		}
		.action-btn.cancel { border-color: var(--red-dim); color: var(--red); }
		.action-btn.cancel:hover { background: var(--red-dim); color: var(--bg0-h); }
		.action-btn.resubmit { border-color: var(--purple-dim); color: var(--purple); }
		.action-btn.resubmit:hover { background: var(--purple-dim); color: var(--bg0-h); }

		.muted-action {
			color: var(--fg4);
			font-size: 0.75rem;
			font-family: 'JetBrains Mono', monospace;
		}

		.empty-row td {
			text-align: center;
			color: var(--fg4);
			padding: 2.5rem;
			font-style: italic;
		}
	</style>
</head>

<body>
	<aside class="sidebar">
		<div class="logo">SKEDULR</div>
		<ul class="nav-links">
			<li class="nav-item active" data-view="all" onclick="showView('all')">Dashboard</li>
			<li class="nav-item" data-view="retrying" onclick="showView('retrying')">Retrying</li>
			<li class="nav-item" data-view="dlq" onclick="showView('dlq')">Dead Tasks</li>
			<li class="nav-item" data-view="cancelled" onclick="showView('cancelled')">Cancelled</li>
		</ul>
	</aside>

	<main class="main-content">
		<header>
			<h1 id="view-title">System Overview</h1>
			<div class="header-controls">
				<span id="pause-pill" class="pause-pill">PAUSED</span>
				<button id="pause-btn" class="btn btn-primary" onclick="togglePause()">Pause Scheduler</button>
				<span><span class="live-dot"></span><span style="font-size: 0.7rem; color: var(--fg4); font-weight: 600; letter-spacing: 0.05em;">LIVE</span></span>
			</div>
		</header>

		<div class="metrics-grid">
			<div class="metric-card queue">
				<span class="metric-label">Queue Size</span>
				<span class="metric-value" id="metric-queue">0</span>
			</div>
			<div class="metric-card retrying">
				<span class="metric-label">Retrying</span>
				<span class="metric-value" id="metric-retrying">0</span>
			</div>
			<div class="metric-card success">
				<span class="metric-label">Processed</span>
				<span class="metric-value" id="metric-success">0</span>
			</div>
			<div class="metric-card failure">
				<span class="metric-label">Failed</span>
				<span class="metric-value" id="metric-failure">0</span>
			</div>
			<div class="metric-card dead">
				<span class="metric-label">Dead</span>
				<span class="metric-value" id="metric-dead">0</span>
			</div>
			<div class="metric-card workers">
				<span class="metric-label">Workers</span>
				<span class="metric-value" id="metric-workers">0</span>
			</div>
		</div>

		<div class="content-card">
			<div class="card-header">
				<h2>Worker Pools</h2>
			</div>
			<div class="pool-grid" id="pool-list"></div>
		</div>

		<div class="content-card">
			<div class="card-header" style="flex-direction: column; align-items: stretch;">
				<div style="display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap;">
					<h2 id="table-title">Task Logs &amp; Activity</h2>
					<div class="filter-row" style="width: auto;">
						<input type="text" id="filter-query" placeholder="Search ID or type..." oninput="fetchStats()" class="search-input" style="width: 220px;">
						<input type="text" id="filter-type" placeholder="Job type..." oninput="fetchStats()" class="search-input" style="width: 140px;">
					</div>
				</div>
				<div class="filter-group" id="status-chips">
					<div class="filter-chip active" onclick="setFilterStatus('')"          data-status="">All</div>
					<div class="filter-chip"        onclick="setFilterStatus('Queued')"    data-status="Queued">Queued</div>
					<div class="filter-chip"        onclick="setFilterStatus('Running')"   data-status="Running">Running</div>
					<div class="filter-chip"        onclick="setFilterStatus('Retrying')"  data-status="Retrying">Retrying</div>
					<div class="filter-chip"        onclick="setFilterStatus('Succeeded')" data-status="Succeeded">Succeeded</div>
					<div class="filter-chip"        onclick="setFilterStatus('Failed')"    data-status="Failed">Failed</div>
					<div class="filter-chip"        onclick="setFilterStatus('Dead')"      data-status="Dead">Dead</div>
					<div class="filter-chip"        onclick="setFilterStatus('Cancelled')" data-status="Cancelled">Cancelled</div>
				</div>
				<input type="hidden" id="filter-status" value="">
			</div>
			<table>
				<thead>
					<tr>
						<th>Task ID</th>
						<th>Type</th>
						<th>Priority</th>
						<th>Status</th>
						<th>Progress</th>
						<th>Actions</th>
					</tr>
				</thead>
				<tbody id="task-list"></tbody>
			</table>
		</div>
	</main>

	<script>
		// ───────────────────────────────────────────────────────────
		// Status taxonomy: keep one source of truth so badge classes,
		// progress chip styling, and action availability all stay in
		// sync if a new status is added on the server side.
		// ───────────────────────────────────────────────────────────
		const STATUS_META = {
			Queued:    { class: "queued",    terminal: false, action: "cancel" },
			Running:   { class: "running",   terminal: false, action: "cancel" },
			Retrying:  { class: "retrying",  terminal: false, action: "cancel" },
			Succeeded: { class: "succeeded", terminal: true,  action: null     },
			Failed:    { class: "failed",    terminal: true,  action: null     },
			Dead:      { class: "dead",      terminal: true,  action: "resubmit" },
			Cancelled: { class: "cancelled", terminal: true,  action: null     },
			Unknown:   { class: "unknown",   terminal: true,  action: null     },
		};

		let currentView = "all";
		window.isPaused = false;

		function showView(view) {
			currentView = view;
			document.querySelectorAll(".nav-item").forEach(el => el.classList.toggle("active", el.dataset.view === view));
			const titles = {
				all:       ["System Overview",       "Task Logs & Activity"],
				retrying:  ["Retrying Tasks",        "Tasks waiting for backoff"],
				dlq:       ["Dead Tasks",            "Exhausted retries — resubmittable"],
				cancelled: ["Cancelled Tasks",       "Tasks explicitly cancelled"],
			};
			const [hdr, tbl] = titles[view] || titles.all;
			document.getElementById("view-title").textContent  = hdr;
			document.getElementById("table-title").textContent = tbl;
			const statusForView = { all: "", retrying: "Retrying", dlq: "Dead", cancelled: "Cancelled" }[view];
			setFilterStatus(statusForView ?? "");
		}

		function setFilterStatus(status) {
			document.getElementById("filter-status").value = status;
			document.querySelectorAll(".filter-chip").forEach(chip => {
				chip.classList.toggle("active", chip.dataset.status === status);
			});
			fetchStats();
		}

		async function fetchStats() {
			try {
				const q      = document.getElementById("filter-query").value;
				const type   = document.getElementById("filter-type").value;
				const status = document.getElementById("filter-status").value;
				const params = new URLSearchParams();
				if (q)      params.append("q", q);
				if (type)   params.append("type", type);
				if (status) params.append("status", status);
				const r = await fetch(`api/stats?${params.toString()}`);
				if (!r.ok) return;
				updateUI(await r.json());
			} catch (e) {
				console.error("fetchStats:", e);
			}
		}

		function updateUI(stats) {
			// ── Counters ──────────────────────────────────────────
			document.getElementById("metric-queue").textContent    = stats.queue_size ?? 0;
			document.getElementById("metric-success").textContent  = stats.success_count ?? 0;
			document.getElementById("metric-failure").textContent  = stats.failure_count ?? 0;
			document.getElementById("metric-dead").textContent     = stats.dead_count ?? 0;
			document.getElementById("metric-workers").textContent  = stats.current_workers ?? 0;
			// Retrying count is derived client-side from active_tasks since the
			// server stats struct doesn't carry it (it would be a per-status
			// breakdown otherwise).
			const retryingCount = (stats.active_tasks || []).filter(t => t.status === "Retrying").length;
			document.getElementById("metric-retrying").textContent = retryingCount;

			// ── Pause state ───────────────────────────────────────
			const pauseBtn  = document.getElementById("pause-btn");
			const pausePill = document.getElementById("pause-pill");
			window.isPaused = !!stats.is_paused;
			if (window.isPaused) {
				pauseBtn.textContent = "Resume Scheduler";
				pauseBtn.classList.remove("btn-primary");
				pauseBtn.classList.add("btn-warn");
				pausePill.classList.add("visible");
			} else {
				pauseBtn.textContent = "Pause Scheduler";
				pauseBtn.classList.remove("btn-warn");
				pauseBtn.classList.add("btn-primary");
				pausePill.classList.remove("visible");
			}

			// ── Pool cards ────────────────────────────────────────
			const poolList = document.getElementById("pool-list");
			poolList.innerHTML = "";
			(stats.pools || []).forEach(pool => {
				const card = document.createElement("div");
				card.className = "pool-card";
				card.innerHTML = `
					<div class="pool-name">${escapeHTML(pool.name)}</div>
					<div>
						<span class="pool-worker-count">${pool.workers}</span>
						<span class="pool-worker-label">workers</span>
					</div>
					<div class="pool-controls">
						<button class="btn" onclick="scalePool('${escapeAttr(pool.name)}', ${pool.workers - 1})">−</button>
						<span class="pool-counter">${pool.workers}</span>
						<button class="btn" onclick="scalePool('${escapeAttr(pool.name)}', ${pool.workers + 1})">+</button>
					</div>
					<div class="pool-queue">queue: <strong>${pool.queue_size}</strong></div>
				`;
				poolList.appendChild(card);
			});

			// ── Task table ────────────────────────────────────────
			// Active tasks reflect the live state — they win over history.
			// History fills in the long tail of terminal tasks already
			// evicted from the active map.
			const list = document.getElementById("task-list");
			list.innerHTML = "";
			const seen = new Map();
			(stats.active_tasks || []).forEach(t => seen.set(t.id, t));
			(stats.history || []).forEach(t => {
				if (!seen.has(t.id)) seen.set(t.id, t);
			});
			const tasks = Array.from(seen.values());

			if (tasks.length === 0) {
				const tr = document.createElement("tr");
				tr.className = "empty-row";
				tr.innerHTML = `<td colspan="6">No matching tasks yet.</td>`;
				list.appendChild(tr);
				return;
			}

			for (const task of tasks) {
				const meta = STATUS_META[task.status] || STATUS_META.Unknown;
				const tr = document.createElement("tr");

				const progressValue = task.status === "Succeeded" ? 100 : (task.progress ?? 0);

				let actionCell = `<span class="muted-action">—</span>`;
				if (meta.action === "cancel") {
					actionCell = `<button class="action-btn cancel" onclick="cancelTask('${escapeAttr(task.id)}')">Cancel</button>`;
				} else if (meta.action === "resubmit") {
					actionCell = `<button class="action-btn resubmit" onclick="resubmitTask('${escapeAttr(task.id)}')">Resubmit</button>`;
				} else if (task.status === "Cancelled") {
					actionCell = `<span class="muted-action">cancelled</span>`;
				}

				tr.innerHTML = `
					<td><span class="task-id">${escapeHTML(task.id)}</span></td>
					<td>
						<div class="task-type">${escapeHTML(task.type || "(in-memory)")}</div>
						<div class="task-meta">pool: ${escapeHTML(task.pool || "default")}</div>
					</td>
					<td><span class="task-priority">${task.priority}</span></td>
					<td><span class="status-badge status-${meta.class}">${escapeHTML(task.status)}</span></td>
					<td><span class="progress-chip ${meta.class}">${progressValue}%</span></td>
					<td>${actionCell}</td>
				`;
				list.appendChild(tr);
			}
		}

		// ── Action helpers ────────────────────────────────────────────
		async function cancelTask(id) {
			try {
				await fetch(`api/cancel?id=${encodeURIComponent(id)}`, { method: "POST" });
				setTimeout(fetchStats, 200);
			} catch (e) { console.error("cancelTask:", e); }
		}

		async function resubmitTask(id) {
			try {
				await fetch(`api/resubmit?id=${encodeURIComponent(id)}`, { method: "POST" });
				setTimeout(fetchStats, 200);
			} catch (e) { console.error("resubmitTask:", e); }
		}

		async function togglePause() {
			const endpoint = window.isPaused ? "api/resume" : "api/pause";
			try {
				await fetch(endpoint, { method: "POST" });
				fetchStats();
			} catch (e) { console.error("togglePause:", e); }
		}

		// Debounce rapid +/- clicks so we don't hammer the API.
		let scaleTimer = null;
		function scalePool(pool, count) {
			if (count < 0) count = 0;
			if (count > 100) count = 100;
			fetchStats(); // optimistic update
			if (scaleTimer) clearTimeout(scaleTimer);
			scaleTimer = setTimeout(async () => {
				try {
					await fetch(`api/scale?pool=${encodeURIComponent(pool)}&count=${count}`, { method: "POST" });
					fetchStats();
				} catch (e) { console.error("scalePool:", e); }
			}, 250);
		}

		// HTML-escape helpers — task IDs and pool names come from user code
		// and could carry quotes or angle brackets that would otherwise
		// break our template literals or open injection holes.
		function escapeHTML(s) {
			return String(s ?? "").replace(/[&<>"']/g, c => ({
				"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
			}[c]));
		}
		function escapeAttr(s) {
			return String(s ?? "").replace(/['"\\]/g, "\\$&");
		}

		// Poll every second; first call kicks off immediately.
		setInterval(fetchStats, 1000);
		fetchStats();
	</script>
</body>

</html>
